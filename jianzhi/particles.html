<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>数字剪纸 · 粒子分镜</title>
<style>
  html, body { margin: 0; background: #040305; overflow: hidden; }
  canvas { display: block; }
  #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 50%, rgba(0,0,0,0.6) 100%); }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }</script>
<script src="tuanhua.js"></script>
</head>
<body>
<div id="vig"></div>
<script type="module">
// =============================================================
//  粒子分镜：?s=招式(2..6) &p=进度(0..1)
//  团花 = 几万颗很细的粒子；光只是一层淡淡的辉光，不画光束
// =============================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
const STAGE = +(Q.get('s') || 6), PROG = +(Q.get('p') || 0.6);
const W = +(Q.get('w') || 900), H = Math.round(W * 1.414);

let seed = 11 + STAGE * 97;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040305);
const camera = new THREE.PerspectiveCamera(38, W / H, 1, 20000);

// ---------- 团花取样：纸上的位置 + 刀口（边缘）多撒一些，花纹才清楚 ----------
async function patternPixels(size) {
  const img = new Image();
  img.src = URL.createObjectURL(new Blob([Tuanhua.svg({ mode: 'mask', size })], { type: 'image/svg+xml' }));
  await img.decode();
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, size, size);
  return x.getImageData(0, 0, size, size).data;
}
const PS = 1024, PIX = await patternPixels(PS);
const on = (u, v) => { if (u < 0 || v < 0 || u >= 1 || v >= 1) return false; return PIX[((v * PS | 0) * PS + (u * PS | 0)) * 4] > 128; };
const edgeAt = (u, v) => { const e = 2.2 / PS; return on(u, v) && !(on(u + e, v) && on(u - e, v) && on(u, v + e) && on(u, v - e)); };
const SAMPLES = [];                                   // 预先取好一池点：[x, y, isEdge]，x,y 在 -0.5..0.5
for (let i = 0; i < 900000 && SAMPLES.length < 160000; i++) {
  const u = rnd(), v = rnd();
  if (!on(u, v)) continue;
  const e = edgeAt(u, v);
  if (!e && rnd() < 0.45) continue;                   // 实心处稀一点，刀口处密一点
  SAMPLES.push([u - 0.5, 0.5 - v, e ? 1 : 0]);
}

// ---------- 粒子缓冲 ----------
const B = { p: [], c: [], s: [], a: [] };
function dot(x, y, z, col, size, alpha) { B.p.push(x, y, z); B.c.push(col[0], col[1], col[2]); B.s.push(size); B.a.push(alpha); }
const RED = [0.95, 0.05, 0.07], RED2 = [1.0, 0.16, 0.13], GOLD = [1.0, 0.68, 0.36], PALE = [1.0, 0.88, 0.74];
function pick() { const k = rnd(); return k < 0.8 ? RED : k < 0.97 ? RED2 : k < 0.995 ? GOLD : PALE; }

// 一朵粒子团花。place(x,y,i) -> [X,Y,Z] 或 null（不画）；默认就是平放在 xy 平面
function flower(n, S, place, o = {}) {
  const step = Math.max(1, Math.floor(SAMPLES.length / n));
  for (let i = 0; i < SAMPLES.length; i += step) {
    const [x, y, e] = SAMPLES[i];
    const r = Math.hypot(x, y) * 2, ang = Math.atan2(x, y) / (Math.PI * 2) + 0.5;
    if (o.wipe !== undefined && ang > o.wipe) continue;
    if (o.reveal !== undefined && r > o.reveal) continue;
    const q = place ? place(x * S, y * S, i, r, ang) : [x * S, y * S, 0];
    if (!q) continue;
    const c = e ? (rnd() < 0.08 ? GOLD : RED2) : pick();
    dot(q[0], q[1], q[2], c, (e ? 1.6 : 1.25) * (o.size || 1) * (0.7 + rnd() * 0.6), (e ? 0.55 : 0.32) * (o.alpha ?? 1) * (q[3] ?? 1));
  }
}
// 细线也用粒子点出来（像发丝一样，淡淡的）
function hairline(pts, density, col, size, alpha) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], L = a.distanceTo(b), n = Math.ceil(L * density);
    for (let k = 0; k < n; k++) { const t = k / n; dot(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t, col, size * (0.6 + rnd() * 0.8), alpha * (0.5 + rnd() * 0.5)); }
  }
}
function circle3(cx, cy, cz, r, flat, seg = 360) {     // flat=true：躺在地上（xz 平面）
  const out = [];
  for (let i = 0; i <= seg; i++) { const a = i / seg * Math.PI * 2; out.push(flat ? new THREE.Vector3(cx + Math.cos(a) * r, cy, cz + Math.sin(a) * r) : new THREE.Vector3(cx + Math.cos(a) * r, cy + Math.sin(a) * r, cz)); }
  return out;
}
function dust(n, place, alpha = 0.18) { for (let i = 0; i < n; i++) { const q = place(); dot(q[0], q[1], q[2], rnd() < 0.7 ? RED2 : GOLD, 0.9 + rnd() * 1.4, alpha * (0.3 + rnd())); } }

// =============================================================
const S = 1000;

// =============================================================
//  规则：所有平面永远正对观众，不倾斜、不翻转。
//  唯一的"第三维"：平面沿正前方往后退 / 往前来，或在平面里往两边散开。
//  镜头只会平移（不转），所以层与层之间只有很轻的视差。
// =============================================================
function cam(dx = 0, dy = 0, Z = 2000) { camera.position.set(dx, dy, Z); camera.lookAt(dx, dy, 0); }
// 团花的 5 圈：花心 / 内瓣 / 锯齿 / 外瓣 / 花边（r 是 0..1 的半径）
const layerOf = r => r < 0.12 ? 0 : r < 0.34 ? 1 : r < 0.45 ? 2 : r < 0.75 ? 3 : 4;
function stage2() {                                   // 蓄力：几层粒子在各自的平面里往拳心旋进去，层与层前后错开
  cam(0, 0, 1800);
  flower(9000, 300, (x, y, i, r, ang) => (ang > 1 / 12 ? null : [x, y, 0]), { size: 1.1, alpha: 1.3 });
  const layers = [[-700, 0.55], [-260, 0.8], [0, 1], [260, 0.7]];
  layers.forEach(([z, a], li) => {
    const arms = 5, tight = 0.6 + PROG * 0.8;
    for (let k = 0; k < arms; k++) {
      const a0 = k / arms * Math.PI * 2 + li * 0.7;
      for (let i = 0; i < 2600; i++) {
        const s = Math.pow(rnd(), 0.7), ang = a0 + s * 3.2 * tight, rad = 40 + (1 - s) * (460 - 140 * PROG) + gauss() * 9;
        dot(Math.cos(ang) * rad, Math.sin(ang) * rad, z, rnd() < 0.88 ? RED : GOLD, 1.1 + rnd() * 0.7, 0.26 * a * Math.pow(s, 0.7));
      }
    }
  });
  dust(1400, () => [gauss() * 700, gauss() * 900, -900 + rnd() * 1100], 0.12);
}

function stage3() {                                   // 展开：一扇一扇甩开；甩出去的粒子带着淡淡的拖影
  camera.position.set(0, 0, 1500); camera.lookAt(0, 0, 0);
  const wipe = 0.4 + 0.6 * PROG;
  flower(70000, 640, null, { wipe });
  // 正在扫开的那条边上，粒子还在往外飞
  for (let i = 0; i < 9000; i++) {
    const [x, y] = SAMPLES[(rnd() * SAMPLES.length) | 0];
    const ang = Math.atan2(x, y) / (Math.PI * 2) + 0.5;
    if (ang < wipe || ang > wipe + 0.18) continue;
    const k = (ang - wipe) / 0.18, out = 1 + k * 0.5 + rnd() * 0.15, dz = k * 300 * (rnd() - 0.3);
    for (let t = 0; t < 4; t++) {                     // 4 个点排成一小段 = 淡淡的拖影
      const f = out - t * 0.025 * k;
      dot(x * 640 * f, y * 640 * f, dz, RED2, 1.1, 0.22 * (1 - k) * (1 - t / 4));
    }
  }
  dust(2600, () => { const a = rnd() * 6.28, r = 300 + Math.pow(rnd(), 0.6) * 700; return [Math.cos(a) * r, Math.sin(a) * r, gauss() * 300]; }, 0.14);
}

const NS = 5, RR = 300, SEAL = 220;
const slot = k => { const a = Math.PI / 2 - k / NS * Math.PI * 2; return [Math.cos(a) * RR, Math.sin(a) * RR]; };
function guides(alpha = 1) {                         // 很淡的细圈，只是"位置"
  const circ = (cx, cy, r, seg = 360) => Array.from({ length: seg + 1 }, (_, i) => { const a = i / seg * Math.PI * 2; return new THREE.Vector3(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 0); });
  hairline(circ(0, 0, RR + 175), 0.45, GOLD, 1.0, 0.18 * alpha);
  return circ;
}
function stage4() {                                   // 结印：伸一根手指，一朵小团花从深处往前飞来，落进自己的位置
  cam(0, 0, 2250);
  const circ = guides();
  const done = 3, q = 0.32;                           // 图里：3 朵已落，第 4 朵正在飞来
  for (let k = 0; k < NS; k++) {
    const [X, Y] = slot(k);
    hairline(circ(X, Y, 116), 0.4, GOLD, 1.0, k < done ? 0.2 : 0.07);
    if (k < done) flower(11000, SEAL, (x, y) => [X + x, Y + y, 0]);
    if (k === done) {
      const pos = t => { const e = ease(t); return [X * (0.15 + 0.85 * e), Y * (0.15 + 0.85 * e), -1600 * (1 - e)]; };
      const [cx, cy, cz] = pos(q);
      flower(9000, SEAL, (x, y) => [cx + x, cy + y, cz], { alpha: 0.85 });
      for (let i = 0; i < 2600; i++) {                // 走过的路：一串很淡的粒子
        const t = q - rnd() * 0.45; if (t < 0) continue; const [px, py, pz] = pos(t);
        dot(px + gauss() * 50, py + gauss() * 50, pz, RED2, 1.1, 0.3 * (1 - (q - t) / 0.45));
      }
    }
  }
  dust(1400, () => [gauss() * 650, gauss() * 800, -1200 + rnd() * 1300], 0.1);
}
function stage5() {                                   // 汇聚：捏住，五朵往中心收，同时一层一层往后退，叠成一摞
  cam(90, 0, 2250);                                   // 镜头往旁边挪一点点，叠起来的层才看得出前后
  guides(0.4);
  const q = 0.5;
  for (let k = 0; k < NS; k++) {
    const [X, Y] = slot(k), e = q, z = -(k + 1) * 190 * e;
    flower(10000, SEAL * (1 + 0.3 * e), (x, y) => [X * (1 - e) + x, Y * (1 - e) + y, z], { alpha: 0.5 });
  }
  flower(9000, SEAL * 1.5, (x, y) => [x, y, 120], { alpha: 0.6 });
  dust(1200, () => [gauss() * 600, gauss() * 700, -1000 + rnd() * 1200], 0.1);
}
function stage6() {                                   // 显形：大团花的 5 圈从深处一圈一圈往前来；还没到的在平面里旋着、散着
  cam(70, 0, 2150);
  const SZ = 950, P = PROG;
  flower(115000, SZ, (x, y, i, r) => {
    const L = layerOf(r), k = ease(clamp((P - L * 0.13) / 0.38));
    if (k >= 0.999) return [x, y, 0];
    const sp = (1 - k), a = Math.atan2(y, x) + sp * (0.9 + 0.25 * L), rr = Math.hypot(x, y) * (1 + sp * 0.5) + sp * gauss() * 60;
    return [Math.cos(a) * rr, Math.sin(a) * rr, -sp * (700 + 260 * L), 0.3 + 0.7 * k];
  });
  dust(2200, () => { const a = rnd() * 6.28, r = 300 + rnd() * 900; return [Math.cos(a) * r, Math.sin(a) * r, -1400 + rnd() * 1400]; }, 0.11);
}
function stage7() {                                   // 定格：五圈团花前后轻轻错开，像几层纸叠在一起，慢慢呼吸
  cam(150, -40, 2150);
  flower(115000, 950, (x, y, i, r) => [x, y, (layerOf(r) - 2) * -130]);
  dust(1600, () => [gauss() * 650, gauss() * 800, -1100 + rnd() * 1300], 0.1);
}

// 手的 21 个关键点（张开的右手，手心朝你），和 MediaPipe 的编号一致
const HAND = [[0,0],[-45,40],[-85,90],[-115,135],[-140,175],[-45,170],[-55,240],[-60,285],[-63,322],[-5,178],[-5,258],[-5,308],[-5,348],[32,170],[38,240],[42,285],[45,320],[62,150],[75,205],[83,240],[90,272]];
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
function stage1() {                                   // 觉醒：粒子沿着手掌轮廓和指骨淡淡亮起
  camera.position.set(0, 0, 1500); camera.lookAt(0, 0, 0);
  const K = 1.85, OX = 30, OY = -330, P = (i) => [HAND[i][0] * K + OX, HAND[i][1] * K + OY];
  const wid = [0, 34, 30, 26, 22, 26, 22, 20, 18, 27, 23, 21, 19, 26, 22, 20, 18, 22, 19, 17, 15];
  for (const [a, b] of BONES) {                       // 每根骨头：中线亮一点，两侧轮廓淡淡的
    const A = P(a), Bp = P(b), L = Math.hypot(Bp[0] - A[0], Bp[1] - A[1]), nx = -(Bp[1] - A[1]) / L, ny = (Bp[0] - A[0]) / L;
    const w = wid[b] * K * 0.5, inner = a === 0 || (a === 5 && b === 9) || (a === 9 && b === 13) || (a === 13 && b === 17);
    for (let i = 0; i < L * 2.2; i++) {
      const t = rnd(), side = rnd() < 0.5 ? -1 : 1, edge = !inner && rnd() < 0.6;
      if (inner && rnd() < 0.5) continue;
      const off = edge ? side * w * (0.92 + gauss() * 0.05) : gauss() * w * 0.25;
      dot(A[0] + (Bp[0] - A[0]) * t + nx * off, A[1] + (Bp[1] - A[1]) * t + ny * off, gauss() * 8, edge ? RED2 : (rnd() < 0.3 ? GOLD : RED), 1.1 + rnd() * 0.6, edge ? 0.3 : 0.4 * (0.5 + 0.5 * Math.sin(t * Math.PI)));
    }
  }
  for (const i of [0, 1, 2, 3, 5, 6, 7, 9, 10, 11, 13, 14, 15, 17, 18, 19]) { const [x, y] = P(i); for (let k = 0; k < 60; k++) dot(x + gauss() * 8, y + gauss() * 8, 0, GOLD, 1.3, 0.35); }
  const palm = [0, 1, 5, 9, 13, 17].map(P);           // 手心：很稀的一层
  for (let i = 0; i < 2500; i++) { const a = palm[(rnd() * 6) | 0], b = palm[(rnd() * 6) | 0], c = palm[(rnd() * 6) | 0], u = rnd(), v = rnd() * (1 - u); dot(a[0] + (b[0] - a[0]) * u + (c[0] - a[0]) * v, a[1] + (b[1] - a[1]) * u + (c[1] - a[1]) * v, 0, RED, 1.0, 0.1); }
  dust(1600, () => { const a = rnd() * 6.28, r = 200 + rnd() * 700; return [Math.cos(a) * r + OX, Math.sin(a) * r * 1.2, gauss() * 200]; }, 0.12);
}

({ 1: stage1, 2: stage2, 3: stage3, 4: stage4, 5: stage5, 6: stage6, 7: stage7 })[STAGE]();

// ---------- 画出来 ----------
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.Float32BufferAttribute(B.p, 3));
g.setAttribute('color', new THREE.Float32BufferAttribute(B.c, 3));
g.setAttribute('size', new THREE.Float32BufferAttribute(B.s, 1));
g.setAttribute('alpha', new THREE.Float32BufferAttribute(B.a, 1));
scene.add(new THREE.Points(g, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { k: { value: H / 1000 } },
  vertexShader: `attribute float size, alpha; attribute vec3 color; uniform float k; varying vec3 vC; varying float vA;
    void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.); gl_Position = projectionMatrix * mv;
      float ps = size * k * 1500. / -mv.z; gl_PointSize = max(ps, 1.0); vC = color; vA = alpha * min(1., ps * ps); }`,
  fragmentShader: `varying vec3 vC; varying float vA;
    void main(){ float d = length(gl_PointCoord - .5) * 2.; float a = exp(-d * d * 3.5) * vA * 3.4; if (a < 0.003) discard; gl_FragColor = vec4(vC, a); }`
})));
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.35, 0.7, 0.55));
composer.addPass(new OutputPass());
composer.render();
window.__done = true;
</script>
</body>
</html>
