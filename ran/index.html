<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, S, t = 0, flowOn = true, soundOn = false, swirl = 0;
let jellies = [], fibers = [], blooms = [], fabric;
const rand = (a,b) => a + Math.random()*(b-a);
const GOLD = '226,192,120', SILK = '238,242,252', INDIGO = '28,52,128';

// ---------- audio: deep, soft bells ----------
let ac = null, master = null;
const NOTES = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3];
function initAudio(){
  if (ac) return;
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .55;
    const dl = ac.createDelay(), fb = ac.createGain(), lp = ac.createBiquadFilter();
    dl.delayTime.value = .37; fb.gain.value = .45; lp.type='lowpass'; lp.frequency.value = 1400;
    master.connect(ac.destination); master.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(ac.destination);
  }catch(e){ ac = null; }
}
// ---------- sea: drone, water, jelly pulses, bubbles, finger in the water ----------
// 海是一条单独的声道：长混响，开 Sound 时慢慢浮起来，关掉时慢慢沉下去
let sea = null, seaStarted = false, NBUF = null, stir = null, nextBubble = 0;
function makeIR(sec, decay){
  const n = Math.floor(ac.sampleRate*sec), b = ac.createBuffer(2, n, ac.sampleRate);
  for (let ch=0; ch<2; ch++){ const d = b.getChannelData(ch); let lp = 0;
    for (let i=0;i<n;i++){ lp += ((Math.random()*2-1) - lp)*.35; d[i] = lp*Math.pow(1-i/n, decay); } }
  return b;
}
function noiseBuffer(sec){
  const n = Math.floor(ac.sampleRate*sec), b = ac.createBuffer(2, n, ac.sampleRate);
  for (let ch=0; ch<2; ch++){ const d = b.getChannelData(ch); for (let i=0;i<n;i++) d[i] = Math.random()*2-1; }
  return b;
}
function lfo(freq, depth, target, phase){
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = freq; g.gain.value = depth; o.connect(g); g.connect(target);
  o.start(ac.currentTime + (phase||0)); return o;
}
function initSea(){
  if (sea || !ac) return;
  sea = ac.createGain(); sea.gain.value = 0;
  const dry = ac.createGain(); dry.gain.value = .5;
  const verb = ac.createConvolver(); verb.buffer = makeIR(6, 2.4);
  const wet = ac.createGain(); wet.gain.value = .9;
  sea.connect(dry); dry.connect(ac.destination); sea.connect(verb); verb.connect(wet); wet.connect(ac.destination);
  NBUF = noiseBuffer(4);
}
function startSea(){
  if (seaStarted || !sea) return; seaStarted = true;
  const now = ac.currentTime;
  // 深处的水压：很低的两个音，慢慢起伏
  const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 160;
  const dg = ac.createGain(); dg.gain.value = .036; lfo(.05, .016, dg.gain);
  [[49, 0], [73.5, 4], [98, -5]].forEach(([f, det], k) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; o.detune.value = det;
    g.gain.value = k === 2 ? .35 : 1; o.connect(g); g.connect(dlp); o.start(now);
  });
  dlp.connect(dg); dg.connect(sea);
  // 水体：滤过的噪声，一涨一落
  const wsrc = ac.createBufferSource(); wsrc.buffer = NBUF; wsrc.loop = true;
  const wlp = ac.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 420; wlp.Q.value = .4;
  lfo(.033, 220, wlp.frequency);

function makeJelly(i, init){

              ringSeed: rand(0,9) };

  for (let k=0;k<nT;k++){

function stepChain(c, root, dt, isArm){

    const p = P[k], vx = (p.x-p.px)*damp, vy = (p.y-p.py)*damp;
    p.px = p.x; p.py = p.y;

    p.y += vy + G*dt2;

    j.vx += current(j.x, j.y)*.35*dt;
    const drag = Math.pow(.35, dt); j.vx *= drag; j.vy *= drag;
    j.x += j.vx*dt; j.y += j.vy*dt;
    const target = Math.sin(t*.13 + j.seed)*.42 + (j.x < W*.1 ? .35 : j.x > W*.9 ? -.35 : 0);
    j.av += ((target - j.a)*1.1 + j.vx*.0015/S)*dt; j.av *= Math.pow(.25, dt); j.a += j.av*dt;
    if (j.y < -j.h*4){ shiftJelly(j, rand(-W*.2, W*.2), H + j.h*9); j.vy = 0; }
    if (j.x < -j.w*2) shiftJelly(j, W + j.w*3, 0);
    if (j.x > W + j.w*2) shiftJelly(j, -W - j.w*3, 0);
    const c = contraction(j);
    for (const tc of j.tents) stepChain(tc, toWorld(j, tc.u*j.w/2*(.85 - .16*c), j.h*.04), dt, false);
    for (const am of j.arms) stepChain(am, toWorld(j, am.u*j.w/2*.5, j.h*.02), dt, true);
  }
  for (const b of blooms){ b.r += (b.max - b.r)*dt*1.1; b.a *= Math.pow(.55, dt); }
  blooms = blooms.filter(b => b.a > .004);
}

// ---------- drawing ----------
function drawThread(P, col, alpha, width, twist, ph){
  // twisted two-ply silk: two strands winding around the path
  const n = P.length;
  for (const side of [1,-1]){
    for (let s=0; s<3; s++){
      const a0 = Math.floor(s*(n-1)/3), a1 = Math.floor((s+1)*(n-1)/3);
      ctx.strokeStyle = `rgba(${col},${alpha*(1-s*.3)})`; ctx.lineWidth = width*(1-s*.22);
      ctx.beginPath();
      for (let k=a0;k<=a1;k++){
        const p = P[k], q = P[Math.min(n-1,k+1)], o = P[Math.max(0,k-1)];
        let nx = -(q.y-o.y), ny = q.x-o.x; const L = Math.hypot(nx,ny)||1; nx/=L; ny/=L;
        const off = Math.sin(k*1.7 + ph + t*.6)*twist*side*(1-k/n*.4);
        const x = p.x + nx*off, y = p.y + ny*off;
        k===a0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }
}
function bellPath(hw, h){
  ctx.beginPath(); ctx.moveTo(-hw, 0);
  ctx.bezierCurveTo(-hw*1.02, -h*1.25, hw*1.02, -h*1.25, hw, 0);
  ctx.quadraticCurveTo(hw*.5, h*.12, 0, h*.06); ctx.quadraticCurveTo(-hw*.5, h*.12, -hw, 0);
}
function drawJelly(j){
  const c = contraction(j), z = j.z, hw = j.w/2*(1-.17*c), h = j.h*(1+.14*c);
  const al = .5 + .5*z;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // silk tentacles
  for (const tc of j.tents) drawThread(tc.pts, tc.col, (tc.col===GOLD ? .8 : .62)*al, (tc.col===GOLD?1:.85)*S*z+.25, 1.3*S*z, tc.ph);
  // oral arms: loose embroidery floss
  for (const am of j.arms){
    drawThread(am.pts, SILK, .22*al, 3.2*S*z, 2.6*S*z, am.ph);
    drawThread(am.pts, SILK, .55*al, .8*S*z+.2, 2.6*S*z, am.ph+1.5);
  }
  // soft lighter halo where the dye lifts
  const ctr = toWorld(j, 0, -h*.45);
  const halo = ctx.createRadialGradient(ctr.x, ctr.y, 0, ctr.x, ctr.y, j.w*1.3);
  halo.addColorStop(0, `rgba(190,205,250,${.1*al})`); halo.addColorStop(1,'rgba(190,205,250,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(ctr.x, ctr.y, j.w*1.3, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(j.x, j.y); ctx.rotate(j.a);
  // undyed cotton bell
  const bg = ctx.createLinearGradient(0, -h*1.0, 0, h*.1);
  bg.addColorStop(0, `rgba(240,243,252,${.88*al})`); bg.addColorStop(1, `rgba(205,215,242,${.7*al})`);
  bellPath(hw, h); ctx.fillStyle = bg; ctx.fill();
  // tie-dye inside the bell
  ctx.save(); bellPath(hw, h); ctx.clip();
  const cx = 0, cy = -h*.42;
  for (const r of j.rays){
    ctx.strokeStyle = `rgba(${INDIGO},${.48*al})`; ctx.lineWidth = r.w*S*z;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(r.a)*hw*.12, cy + Math.sin(r.a)*hw*.12);
    ctx.lineTo(cx + Math.cos(r.a)*hw*r.l*1.3, cy + Math.sin(r.a)*hw*r.l*1.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - Math.cos(r.a)*hw*.12, cy - Math.sin(r.a)*hw*.12);
    ctx.lineTo(cx - Math.cos(r.a)*hw*r.l*1.3, cy - Math.sin(r.a)*hw*r.l*1.3); ctx.stroke();
  }
  for (let i=1;i<=2;i++) wobbleRing(ctx, cx, cy, hw*i*.42, .07, j.ringSeed+i, 2.2*S*z, `rgba(${INDIGO},${.45*al})`);
  const edge = ctx.createRadialGradient(cx, cy, hw*.55, cx, cy, hw*1.25);
  edge.addColorStop(0, 'rgba(30,55,135,0)'); edge.addColorStop(1, `rgba(30,55,135,${.75*al})`);
  ctx.fillStyle = edge; ctx.fillRect(-hw*1.2, -h*1.3, hw*2.4, h*1.6);
  ctx.restore();
  // satin-stitch rim
  ctx.strokeStyle = `rgba(${SILK},${.85*al})`; ctx.lineWidth = 1*S*z+.2;
  for (let i=0;i<=22;i++){
    const u = -1 + i/11, x = u*hw*.98, y = (1-u*u)*h*.07;
    ctx.beginPath(); ctx.moveTo(x - 1.5*S*z, y - 2.2*S*z); ctx.lineTo(x + 1.5*S*z, y + 2.2*S*z); ctx.stroke();
  }
  // gold-thread gonads (a nod to 粤绣's metallic couching)
  ctx.strokeStyle = `rgba(${GOLD},${.9*al})`; ctx.lineWidth = 1.3*S*z;
  for (let i=0;i<4;i++){
    const ang = (i/4)*Math.PI*2 + .4, ex = Math.cos(ang)*hw*.26, ey = -h*.42 + Math.sin(ang)*h*.11;
    ctx.beginPath(); ctx.ellipse(ex, ey, hw*.14, h*.09, ang, 0, Math.PI*2); ctx.stroke();
  }
  // outline in silk
  bellPath(hw, h); ctx.strokeStyle = `rgba(${SILK},${.6*al})`; ctx.lineWidth = .9*S*z+.2; ctx.stroke();
  ctx.restore();
}
function frame(){
  ctx.drawImage(fabric, 0, 0, W, H);
  // dye bleeding where you touched
  for (const b of blooms){
    for (let i=0;i<3;i++){
      const ox = Math.cos(b.seed+i*2.1)*b.r*.18, oy = Math.sin(b.seed+i*2.1)*b.r*.18, rr = b.r*(.8+i*.12);
      const g = ctx.createRadialGradient(b.x+ox, b.y+oy, 0, b.x+ox, b.y+oy, rr);
      g.addColorStop(0, `rgba(215,226,252,${b.a*.6})`); g.addColorStop(.7, `rgba(170,190,245,${b.a*.35})`); g.addColorStop(1,'rgba(170,190,245,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x+ox, b.y+oy, rr, 0, 7); ctx.fill();
    }
  }
  // loose cotton fibres drifting
  ctx.lineCap = 'round';
  for (const f of fibers){
    f.y += f.s*.016; f.x += current(f.x, f.y)*.012 + Math.sin(t*.5+f.p)*.06; f.a += .004;
    if (f.y > H+5){ f.y = -5; f.x = rand(0,W); } if (f.x > W+5) f.x = -5; if (f.x < -5) f.x = W+5;
    ctx.strokeStyle = `rgba(230,236,252,${f.o})`; ctx.lineWidth = .7;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo(f.x+Math.cos(f.a)*f.l*.6, f.y+Math.sin(f.a+1)*f.l*.6, f.x+Math.cos(f.a)*f.l, f.y+Math.sin(f.a)*f.l); ctx.stroke();
  }
  for (const j of jellies) drawJelly(j);
}

let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(.05, (now-last)/1000); last = now;
  const hs = 1/90; while (acc >= hs){ step(hs); acc -= hs; }
  frame(); requestAnimationFrame(loop);
}
setup();
for (let i=0;i<270;i++) step(1/90);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 150); });
requestAnimationFrame(loop);
})();
</script>
